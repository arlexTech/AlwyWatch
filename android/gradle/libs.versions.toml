[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
jna = "5.19.1"
coroutines = "1.11.0"
work = "2.12.0"
# Media3 pinned to 1.8.0: Jellyfin's prebuilt FFmpeg audio decoder and ass-media (libass)
# are both built against exactly this version.
media3 = "1.8.0"
media3-ffmpeg = "1.8.0+1"
ass-media = "0.5.1"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
androidx-junit = "1.3.0"
uiautomator = "2.4.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-ffmpeg = { module = "org.jellyfin.media3:media3-ffmpeg-decoder", version.ref = "media3-ffmpeg" }
ass-media = { module = "io.github.peerless2012:ass-media", version.ref = "ass-media" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
