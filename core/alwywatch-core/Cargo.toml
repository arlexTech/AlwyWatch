[package]
name = "alwywatch-core"
description = "AlwyWatch core facade: app state, cache-first repositories and the UniFFI surface for native UIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `lib` for the desktop app (direct Rust calls), `cdylib` for Android (UniFFI + JNA).
crate-type = ["lib", "cdylib"]
name = "alwywatch_core"

[dependencies]
net = { workspace = true }
media-api = { workspace = true, features = ["uniffi"] }
store = { workspace = true }
downloads = { workspace = true, features = ["uniffi"] }
seerr = { workspace = true, features = ["uniffi"] }
keep-service = { workspace = true, features = ["uniffi"] }
# Translations, shared with the desktop and web apps (one catalog per language in /i18n).
i18n = { workspace = true }
uniffi = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# QR code of the Quick Connect address (Nayuki's encoder: no dependencies, ~30 KB of code).
qrcodegen = "1.8"
# Reads the QR code another device shows ("Sign in another device" on the phone): pure Rust,
# no image library (default features off), so no camera SDK or Play Services is needed.
rqrr = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }


# Android only: initialise rustls-platform-verifier (system trust store via JNI) at app start.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[lints]
workspace = true
