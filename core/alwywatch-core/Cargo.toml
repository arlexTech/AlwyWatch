[package]
name = "alwywatch-core"
description = "AlwyWatch core facade: app state, cache-first repositories and the UniFFI surface for native UIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `lib` for the desktop app (direct Rust calls), `cdylib` for Android (UniFFI + JNA).
crate-type = ["lib", "cdylib"]
name = "alwywatch_core"

[dependencies]
net = { workspace = true, features = ["uniffi"] }
media-api = { workspace = true, features = ["uniffi"] }
store = { workspace = true }
uniffi = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
