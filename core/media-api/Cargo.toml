[package]
name = "media-api"
description = "MediaServer trait and Jellyfin/Plex clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Derives UniFFI records/enums on the models so alwywatch-core can export them as-is.
uniffi = ["dep:uniffi"]

[dependencies]
# User-facing texts built here (labels, error sentences) in the app's language.
i18n = { workspace = true }
net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uniffi = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
net = { workspace = true }

[lints]
workspace = true
