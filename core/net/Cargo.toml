[package]
name = "net"
description = "Shared HTTP client setup (rustls + ring, platform verifier) and error type for core clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# User-facing texts built here (labels, error sentences) in the app's language.
i18n = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Native only: in a browser (wasm32) the browser does TLS through fetch().
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true }

[lints]
workspace = true
