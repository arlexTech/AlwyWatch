<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090c">
  <title>AlwyWatch</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="modulepreload" href="/alwywatch_web.js">
  <link rel="preload" href="/alwywatch_web_bg.wasm" as="fetch" type="application/wasm" crossorigin>
  <script type="module">
    import init from '/alwywatch_web.js';
    init({ module_or_path: '/alwywatch_web_bg.wasm' }).catch((e) => {
      console.error(e);
      const b = document.getElementById('boot');
      if (b) b.innerHTML = '<p>AlwyWatch couldn\'t start. Check your connection, then <a class="button primary" href="">reload</a>.</p>' +
        '<p class="muted small">If it keeps happening, this browser may be too old.</p>';
    });
  </script>
</head>
<body>
  <div id="boot" role="status"><div class="spinner"></div><p class="muted">Loading AlwyWatch…</p></div>
  <noscript><p>AlwyWatch needs JavaScript.</p></noscript>
  <script>
    // An old browser can't even load the module: say so instead of spinning forever.
    if (!('noModule' in HTMLScriptElement.prototype) || typeof WebAssembly !== 'object') {
      document.getElementById('boot').innerHTML = '<p>This browser is too old for AlwyWatch. Use a recent Firefox, Chrome, Edge or Safari.</p>';
    }
  </script>
</body>
</html>
