<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090c">
  <title>AlwyWatch</title>
  <link rel="icon" href="/icon.svg">
  <!-- "Add to Home Screen" (iPhone, iPad, Android): opens full screen, like an app. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AlwyWatch">
  <link rel="stylesheet" href="/style.css">
  <link rel="modulepreload" href="/alwywatch_web.js">
  <link rel="preload" href="/alwywatch_web_bg.wasm" as="fetch" type="application/wasm" crossorigin>
  <!-- Scripts are files, never inline: the server's Content-Security-Policy refuses inline ones. -->
  <script type="module" src="/boot.js"></script>
</head>
<body>
  <div id="boot" role="status"><div class="spinner"></div><p class="muted">Loading AlwyWatch…</p></div>
  <noscript><p>AlwyWatch needs JavaScript.</p></noscript>
  <script src="/compat.js"></script>
</body>
</html>
