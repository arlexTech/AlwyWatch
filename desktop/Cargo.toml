[package]
name = "alwywatch-desktop"
description = "AlwyWatch desktop app (Linux, Windows): Slint UI + libmpv."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "alwywatch"
path = "src/main.rs"

[dependencies]
alwywatch-core = { workspace = true }
slint = { workspace = true, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }
# Decodes cached posters off the UI thread (same crate and version Slint uses internally); also
# crops custom avatars (EXIF orientation, resize) and encodes them as JPEG (the `jpeg` feature
# has both the decoder and the encoder).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The admin "kept forever" stats type (`ForeverStats`), kept to redraw it when avatars arrive;
# a workspace crate the core already compiles in (no size cost).
keep-service = { workspace = true }
# Translations shared with the other apps (/i18n), and the system's languages (already built
# for Slint's own translation support).
i18n = { workspace = true }
sys-locale = "0.3"
# Fetches custom avatars with the AlwyWatch sign-in headers (the core's shared HTTP setup, already
# compiled in: no size cost).
net = { workspace = true }
# The native "choose a picture" dialog for custom avatars. 0.17 (0.18 needs Rust 1.92): on Linux
# the xdg-desktop-portal backend talks D-Bus through libdbus loaded at runtime (no GTK, no zbus;
# zenity as fallback), on Windows the system dialog through windows-sys (already in the tree).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Loads libmpv at runtime, so the app runs (and browses) without it.
libloading = "0.8"
# The device-transfer envelope (same JSON as Android); already compiled in through the core.
serde_json = { workspace = true }
# oneshot channel for the timer-based sleep (already compiled in through the core).
# rt: the segments probe test hook (the core already links tokio's runtime).
tokio = { workspace = true, features = ["sync", "rt"] }
# Profile PINs: salted PBKDF2-HMAC-SHA256 and the salt's randomness. Already compiled in
# through rustls (the core's TLS), so no size cost.
ring = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
# DPAPI for token storage.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true
