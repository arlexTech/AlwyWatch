[package]
name = "uniffi-bindgen"
description = "Pinned uniffi-bindgen CLI (same uniffi version as the core) used by the Gradle build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true
