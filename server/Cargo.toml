[package]
name = "alwywatch-server"
description = "AlwyWatch keep service: per-user keep requests applied to Maintainerr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json", "query"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Config file with the allow-list of servers.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
net = { workspace = true }
maintainerr = { workspace = true }
keep-service = { workspace = true }
# OS random generator for codes and secrets (already built for keep-service: no new crate).
ring = "0.17"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
wiremock = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
