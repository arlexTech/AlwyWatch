[package]
name = "alwywatch-server"
description = "AlwyWatch keep service: per-user keep requests applied to Maintainerr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
