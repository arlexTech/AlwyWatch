[package]
name = "alwywatch-server"
description = "AlwyWatch keep service: per-user keep requests applied to Maintainerr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json", "query"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time", "fs"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Config file with the allow-list of servers.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
net = { workspace = true }
maintainerr = { workspace = true }
keep-service = { workspace = true }
# OS random generator for codes and secrets (already built for keep-service: no new crate).
ring = "0.17"
# Password hashing for AlwyWatch accounts (Argon2id, pure Rust; same choice as alwymail).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
# The OS generator for argon2 salts (rand_core is already in the tree through argon2).
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
# Invitation emails through the owner's SMTP server (server only, no effect on the apps; rustls
# with ring and the system certificates, as the rest of the server).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
# The invitation email in the inviting admin's language (the apps' catalogs).
i18n = { workspace = true }

# Already in the build through axum: switching to new settings without closing the site
# (one service in front, the current router behind it).
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
