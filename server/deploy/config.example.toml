# alwywatch-server configuration: copy to ./data/config.toml and fill in.
# Minimum: one [[servers]] entry and [maintainerr]. Everything else is optional.

# Minutes between two readings of Maintainerr.
sync_minutes = 10

# One entry per media server your users sign in to. Only users of these servers can use
# this AlwyWatch server.
[[servers]]
# Jellyfin: open https://<your jellyfin>/System/Info/Public in a browser and copy "Id".
id = "<jellyfin server id>"
kind = "jellyfin"
# The name people see when they pick a server.
name = "HomeJelly"
# The address your users' devices use to reach it (https is required for the web app).
public_url = "https://jellyfin.example.org"
# Jellyfin only, optional: how this container reaches it (default: public_url).
internal_url = "http://jellyfin:8096"

# Plex: delete this block if you have no Plex.
# [[servers]]
# # Open https://<your plex>/identity in a browser and copy "machineIdentifier".
# id = "<plex machineIdentifier>"
# kind = "plex"
# name = "HomePlex"
# public_url = "https://plex.example.org"

[maintainerr]
url = "http://maintainerr:6246"
# The id (from [[servers]] above) of the media server Maintainerr is set up for.
server = "<jellyfin server id>"

# Optional, Plex users: lets "keep until I have watched it" end by itself. Needs
# TAUTULLI_API_KEY.
# [tautulli]
# url = "http://tautulli:8181"

# Optional: requests through this server (the web app needs it; so do users of the media
# server type your Seerr is not set up for). Needs SEERR_API_KEY. A user with no Seerr
# account gets a local Seerr user created once, with Seerr's default permissions
# (create_users = false: they are told to ask you instead).
# [seerr]
# url = "http://seerr:5055"
# public_url = "https://seerr.example.org"
# create_users = true
