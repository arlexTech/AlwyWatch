# alwywatch-server next to your Maintainerr / Jellyfin / Plex. Step by step: docs/deploy.md.
# There is no prebuilt image yet; build it once from the repository root:
#   docker build -f server/Dockerfile -t alwywatch-server .
name: alwywatch

services:
  alwywatch-server:
    image: alwywatch-server:latest
    container_name: alwywatch-server
    restart: unless-stopped
    # Least privilege: no Linux capabilities, no privilege escalation, read-only root (it only
    # writes to /data).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Everything here is optional and read from the .env file next to this one
    # (see .env.example; chmod 600 .env).
    environment:
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY:-}
      MAINTAINERR_API_KEY: ${MAINTAINERR_API_KEY:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ALWYWATCH_PUBLIC_URL: ${ALWYWATCH_PUBLIC_URL:-}
      ALWYWATCH_REGISTRATION: ${ALWYWATCH_REGISTRATION:-invite}
      ALWYWATCH_POCKETID_ISSUER: ${ALWYWATCH_POCKETID_ISSUER:-}
      ALWYWATCH_POCKETID_CLIENT_ID: ${ALWYWATCH_POCKETID_CLIENT_ID:-}
      ALWYWATCH_POCKETID_CLIENT_SECRET: ${ALWYWATCH_POCKETID_CLIENT_SECRET:-}
      ALWYWATCH_DRY_RUN: ${ALWYWATCH_DRY_RUN:-}
    volumes:
      - ./data:/data            # config.toml + the database (owned by uid 65534)
    networks:
      - media
    # No published port: your reverse proxy reaches alwywatch-server:8080 on the shared
    # network. Publishing the port would let clients skip the proxy and forge the address the
    # sign-in rate limit goes by. For a quick LAN trial only: ports: ["8080:8080"].
    expose:
      - "8080"

networks:
  # The Docker network your Maintainerr and Jellyfin containers (and your reverse proxy) are
  # on: `docker network ls`. Containers on several networks: list each one here and above.
  # Not using Docker networks: delete this, and put LAN addresses in config.toml.
  media:
    external: true
    name: CHANGE_ME_default
