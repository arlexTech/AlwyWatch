# alwywatch-server. Step by step: docs/deploy.md. Everything else (media servers, API keys,
# Maintainerr, Seerr, Tautulli, email, sign-up) is set up in the web app: Settings → Admin →
# Server settings. A new server prints a setup code in its log: docker logs alwywatch-server
# There is no prebuilt image yet; build it once from the repository root:
#   docker build -f server/Dockerfile -t alwywatch-server .
name: alwywatch

services:
  alwywatch-server:
    image: alwywatch-server:latest
    container_name: alwywatch-server
    restart: unless-stopped
    # Least privilege: no Linux capabilities, no privilege escalation, read-only root (it only
    # writes to /data).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data            # settings and database (owned by uid 65534; keep it private)
    networks:
      - media
    # No published port: your reverse proxy reaches alwywatch-server:8080 on the shared
    # network. Publishing the port would let clients skip the proxy and forge the address the
    # sign-in rate limit goes by. For a quick LAN trial only: ports: ["8080:8080"].
    expose:
      - "8080"

networks:
  # The Docker network your Jellyfin, Maintainerr and reverse proxy are on: `docker network
  # ls`. Containers on several networks: list each one here and above. On a machine of its
  # own: delete this, and use addresses reachable from there in Server settings.
  media:
    external: true
    name: CHANGE_ME_default
