# alwywatch-server next to Maintainerr/Seerr/Plex/Jellyfin/Tautulli. Not deployed automatically:
# see docs/deploy.md. Build the image first:  docker build -f server/Dockerfile -t alwywatch-server .
name: alwywatch

services:
  alwywatch-server:
    image: alwywatch-server:latest
    container_name: alwywatch-server
    restart: unless-stopped
    # Least privilege: no Linux capabilities, no privilege escalation, read-only root (it only
    # writes to /data).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Brussels
      # Secrets (put them in an .env file next to this compose file, chmod 600).
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SEERR_API_KEY: ${SEERR_API_KEY:-}   # Seerr bridge (Seerr → Settings → General → API key)
      # MAINTAINERR_API_KEY: ${MAINTAINERR_API_KEY}   # only if you enable Maintainerr's API key
      # AlwyWatch accounts (docs/keep-protocol.md "AlwyWatch accounts"): this site's address
      # (passkeys and Pocket ID need it), who may sign up, and Pocket ID (optional; callback
      # <public URL>/v1/account/oidc/callback).
      ALWYWATCH_PUBLIC_URL: ${ALWYWATCH_PUBLIC_URL:-}
      ALWYWATCH_REGISTRATION: ${ALWYWATCH_REGISTRATION:-invite}
      ALWYWATCH_POCKETID_ISSUER: ${ALWYWATCH_POCKETID_ISSUER:-}
      ALWYWATCH_POCKETID_CLIENT_ID: ${ALWYWATCH_POCKETID_CLIENT_ID:-}
      ALWYWATCH_POCKETID_CLIENT_SECRET: ${ALWYWATCH_POCKETID_CLIENT_SECRET:-}
    volumes:
      - ./data:/data            # config.toml + keep.sqlite (owned by uid 65534)
    networks:
      - vod_default             # maintainerr (and seerr)
      - plex_default
      - jellyfin_default
      - tautulli_default
    # No published port: Caddy reaches it on the shared network (add caddy to "alwywatch").
    expose:
      - "8080"

networks:
  vod_default:
    external: true
  plex_default:
    external: true
  jellyfin_default:
    external: true
  tautulli_default:
    external: true
